# OpenTelemetry Collector da EC2 do Grafana (T14, ADR-0037): segunda barreira contra dado sensível.
# A primeira é a lista de permissão do SDK (ADR-0031); aqui a mesma lista vale de novo, e valores
# com cara de dado pessoal ou de sessão são mascarados em qualquer atributo e no corpo dos logs.
#
# Variáveis (arquivo .env do compose):
#   OTLP_ESCUTA      host:porta do receiver OTLP/HTTP (na EC2, o IP privado:4318)
#   AWS_REGION       região dos grupos de log
#   GRUPOS_DE_LOG    prefixo dos grupos lidos do CloudWatch (vazio desliga a leitura na prática)
#   DESTINO_*        endereços do Tempo, do Loki e do Prometheus

extensions:
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:OTLP_ESCUTA}
        # Sem CORS: só as tasks falam com o Collector, nunca um navegador.
  aws_cloudwatch:
    region: ${env:AWS_REGION}
    logs:
      poll_interval: 1m
      groups:
        autodiscover:
          limit: 50
          prefix: ${env:GRUPOS_DE_LOG}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 160
    spike_limit_mib: 40

  # Corpo dos logs: o redaction só olha atributos, então o texto do CloudWatch é mascarado aqui.
  transform/corpo:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "\\b\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}\\b", "***CPF***")
          - replace_pattern(body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "***EMAIL***")
          - replace_pattern(body, "(?i)bearer\\s+[A-Za-z0-9._~+/=-]+", "***TOKEN***")
          - replace_pattern(body, "eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]*", "***JWT***")
          - replace_pattern(body, "(?i)(cookie|csrf[_-]?token|session|sessao|senha|password|secret|segredo)([\"']?\\s*[:=]\\s*)[^\\s,;\"'}]+", "$$1$$2***")
          - replace_pattern(body, "\\b\\d{6}\\b", "***")
          - replace_pattern(body, "\\b\\d{1,3}(\\.\\d{1,3}){3}\\b", "***IP***")

  # Logs do CloudWatch chegam sem service.name: usa o grupo (/ecs/cybersec/backend etc.).
  transform/origem:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - set(attributes["service.name"], attributes["cloudwatch.log.group.name"]) where attributes["service.name"] == nil and attributes["cloudwatch.log.group.name"] != nil

  # Spans: o redaction não olha o nome nem o status. O SDK já troca o nome de span sem rota pelo
  # método e não manda descrição de status (ADR-0031); aqui é a segunda barreira.
  transform/spans:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(status.message, "")
          - replace_pattern(name, "\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}", "***")
          - replace_pattern(name, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "***")
          - replace_pattern(name, "\\d{4,}", "***")

  # Atributos (recurso, span, métrica, log): só os da lista; o resto é removido. Valores que
  # pareçam CPF, e-mail, token ou código TOTP são mascarados mesmo em chave permitida.
  redaction:
    allow_all_keys: false
    allowed_keys:
      # Recurso (ADR-0031: só nome do serviço e ambiente) e origem dos logs do CloudWatch.
      - service.name
      - deployment.environment.name
      - cloudwatch.log.group.name
      - cloudwatch.log.stream
      - aws.region
      # Lista de permissão do SDK (backend/app/core/telemetria.py, frontend/src/telemetria.js).
      - http.request.method
      - http.method
      - http.route
      - http.response.status_code
      - http.status_code
      - url.scheme
      - http.scheme
      - network.protocol.version
      - http.flavor
      - error.type
      - db.system
      - db.system.name
      - db.name
      - db.namespace
      - db.operation
      - db.operation.name
      - exception.type
      # Atributos que o Prometheus e o Tempo geram a partir do recurso.
      - otel.scope.name
      - otel.scope.version
    blocked_values:
      - "\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}"
      - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
      - "(?i)bearer\\s+\\S+"
      - "eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+"
      - "^\\d{6}$"
      - "\\b\\d{1,3}(\\.\\d{1,3}){3}\\b"
    summary: silent

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp_grpc/tempo:
    endpoint: ${env:DESTINO_TEMPO}
    tls:
      insecure: true # só no host (127.0.0.1)
  otlp_http/loki:
    endpoint: ${env:DESTINO_LOKI}
  otlp_http/prometheus:
    endpoint: ${env:DESTINO_PROMETHEUS}
    # O Prometheus aceita métricas OTLP; logs e traces não vão para ele.
    traces_endpoint: ""
    logs_endpoint: ""

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/spans, redaction, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, redaction, batch]
      exporters: [otlp_http/prometheus]
    logs:
      receivers: [otlp, aws_cloudwatch]
      processors: [memory_limiter, transform/origem, transform/corpo, redaction, batch]
      exporters: [otlp_http/loki]
